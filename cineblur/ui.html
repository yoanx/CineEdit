<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineBlur</title>
<style>
/* ── 设计变量 ─────────────────────────────────────────────
   单一强调色（陶土红），其余靠字重与留白建立层级。
   所有间距走 4px 网格：4 / 8 / 12 / 16 / 20 / 24 / 32。      */
:root{
  --paper:#f7f5f1;
  --surface:#fcfbf8;
  --sunken:#efebe2;
  --stage:#eae6dd;
  --ink:#1a1916;
  --ink-2:#57534b;
  --ink-3:#928d82;
  --rule:#e4e0d7;
  --rule-2:#d6d1c6;
  --accent:#b1502f;
  --accent-w:#f4e5df;
  --ok:#3d6b4c;
  --warn:#a4671c;
  --err:#a33a2c;
  --focus:0 0 0 3px rgba(26,25,22,.16);
  --ease:cubic-bezier(.22,1,.36,1);
  --r:6px;
  --rail:340px;
  --h-top:56px;--h-bar:40px;--h-time:78px;--pad:24px;
  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font:12.5px/1.55 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  color:var(--ink);background:var(--paper);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── 骨架 ─────────────────────────────────────────────── */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}

/* ── 顶栏 ─────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--rule);
  z-index:20;min-width:0;
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.mark{
  width:22px;height:22px;border-radius:5px;flex:none;
  background:#2a2620;
  position:relative;overflow:hidden;
}
.mark::before{
  content:"";position:absolute;left:4px;top:9px;width:9px;height:4px;border-radius:1px;
  background:#f6f3ec;
}
.mark::after{
  content:"";position:absolute;left:4px;top:10px;width:3px;height:2px;border-radius:1px;
  background:#f6f3ec;
}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);display:block}

.chip{
  display:flex;align-items:center;gap:8px;min-width:0;
  padding:5px 10px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--paper);color:var(--ink-2);font-size:11.5px;
}
.chip b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw}
.chip span{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.empty{color:var(--ink-3);border-style:dashed}
.spacer{flex:1;min-width:8px}

.tag-gpu{
  display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;padding-right:4px;
}
.tag-gpu i{width:6px;height:6px;border-radius:50%;background:var(--rule-2);flex:none}
.tag-gpu.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,107,76,.14)}

.btn{
  border:1px solid transparent;border-radius:var(--r);padding:7px 14px;
  font-size:12px;font-weight:500;letter-spacing:.01em;
  transition:background .15s var(--ease),border-color .15s var(--ease),
             color .15s var(--ease),opacity .15s var(--ease);
  white-space:nowrap;
}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink-2)}
.btn.ghost:hover{background:var(--paper);border-color:var(--rule-2);color:var(--ink)}
.btn.solid{background:var(--ink);color:#faf7f1}
.btn.solid:hover{background:#000}
.btn.solid:disabled,.btn.ghost:disabled{opacity:.35;cursor:default}
.btn.block{display:block;width:100%;padding:9px 14px}
.btn.sm{padding:5px 10px;font-size:11px}

/* ── 主区 ─────────────────────────────────────────────── */
.workspace{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);
  min-height:0;overflow:hidden}

/* 舞台 */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.stage-bar{
  height:40px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid rgba(26,25,22,.07);
  background:rgba(251,250,247,.5);
}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r);padding:2px;gap:2px}
.seg button{
  border:0;background:none;font-size:11.5px;color:var(--ink-2);
  padding:4px 11px;border-radius:4px;transition:all .14s var(--ease);
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(26,25,22,.1)}
.stage-meta{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

.viewport{
  position:relative;flex:1;min-height:0;display:grid;place-items:center;
  padding:24px;overflow:hidden;
}

/* 空状态 */
.empty{text-align:center;max-width:340px}
.empty h2{font-size:15px;font-weight:600;margin-bottom:6px;letter-spacing:.01em}
.empty p{font-size:12px;color:var(--ink-3);line-height:1.7}
.empty .btn{margin-top:18px}
.recent{margin-top:26px;text-align:left}
.recent h3{
  font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);
  font-weight:600;margin-bottom:8px;
}
.recent button{
  display:block;width:100%;text-align:left;border:0;background:none;
  padding:5px 8px;border-radius:4px;font-size:11.5px;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:background .12s var(--ease),color .12s var(--ease);
}
.recent button:hover{background:var(--surface);color:var(--ink)}

/* 画面 */
.frame{
  position:relative;line-height:0;background:#0d0c0a;
  border:1px solid rgba(26,25,22,.16);
  box-shadow:0 1px 2px rgba(26,25,22,.06),0 12px 34px -18px rgba(26,25,22,.4);
  max-width:100%;
  max-height:calc(100vh - var(--h-top) - var(--h-bar) - var(--h-time) - var(--pad) * 2);
  max-height:calc(100dvh - var(--h-top) - var(--h-bar) - var(--h-time) - var(--pad) * 2);
}
.frame img{
  display:block;max-width:100%;
  max-height:calc(100vh - var(--h-top) - var(--h-bar) - var(--h-time) - var(--pad) * 2);
  max-height:calc(100dvh - var(--h-top) - var(--h-bar) - var(--h-time) - var(--pad) * 2);
  object-fit:contain;
}
.frame img.over{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.frame[data-mode="orig"] .over,
.frame[data-mode="blur"] .base{visibility:hidden}
.badge{
  position:absolute;top:9px;font-size:9px;letter-spacing:.14em;font-weight:600;
  color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.7);pointer-events:none;
  transition:opacity .15s var(--ease);
}
.badge.l{left:11px}.badge.r{right:11px}
.frame[data-mode="orig"] .badge.r,
.frame[data-mode="blur"] .badge.l{opacity:0}

.wipe{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
  background:rgba(255,255,255,.94);cursor:ew-resize;
  box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.wipe::after{
  content:"";position:absolute;top:50%;left:50%;width:26px;height:26px;
  margin:-13px 0 0 -13px;border-radius:50%;background:rgba(251,250,247,.96);
  border:1px solid rgba(26,25,22,.18);box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.frame[data-mode="orig"] .wipe,.frame[data-mode="blur"] .wipe{display:none}

/* 加载指示 */
.spin{
  position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);
  display:flex;align-items:center;gap:7px;
  font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);
  background:rgba(251,250,247,.94);border:1px solid var(--rule);
  border-radius:100px;padding:4px 11px 4px 9px;
  opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease);
  z-index:5;
}
.spin.on{opacity:1;transform:translate(-50%,0)}
.spin i{
  width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule-2);
  border-top-color:var(--accent);animation:rot .7s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── 时间轴 ───────────────────────────────────────────── */
.timeline{flex:none;background:var(--surface);border-top:1px solid var(--rule);padding:10px 16px 8px}
.track{
  position:relative;height:26px;border-radius:4px;background:var(--sunken);
  cursor:pointer;overflow:hidden;touch-action:none;
}
.track .ticks{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(90deg,rgba(26,25,22,.13) 0 1px,transparent 1px 100%);
  background-size:calc(100% / 12) 100%;opacity:.55;
}
.track .band{
  position:absolute;top:0;bottom:0;
  background:rgba(177,80,47,.13);
  border-left:1px solid rgba(177,80,47,.42);border-right:1px solid rgba(177,80,47,.42);
}
.track .run{position:absolute;top:0;bottom:0;left:0;width:0;
  background:rgba(26,25,22,.1);border-right:1px solid rgba(26,25,22,.35);
  transition:width .25s linear}
.track .head{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);
  box-shadow:0 0 0 1px rgba(251,250,247,.7)}
.track .head::before{
  content:"";position:absolute;top:0;left:50%;width:9px;height:9px;margin-left:-4.5px;
  background:var(--ink);border-radius:0 0 3px 3px;
}
.handle{
  position:absolute;top:0;bottom:0;width:11px;cursor:ew-resize;z-index:3;
  display:grid;place-items:center;
}
.handle::after{
  content:"";width:5px;height:13px;border-radius:2px;background:rgba(177,80,47,.55);
  transition:background .14s var(--ease),height .14s var(--ease);
}
.handle:hover::after{background:var(--accent);height:17px}

.transport{display:flex;align-items:center;gap:14px;margin-top:9px}
.tbtn{
  width:24px;height:24px;border:0;background:none;color:var(--ink-2);
  border-radius:4px;font-size:14px;line-height:1;display:grid;place-items:center;
  transition:background .12s var(--ease),color .12s var(--ease);
}
.tbtn:hover{background:var(--sunken);color:var(--ink)}
.tc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tc b{color:var(--ink);font-weight:500}
.tips{font-size:10px;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
.tips kbd{
  font:inherit;font-family:var(--mono);font-size:9.5px;padding:1px 4px;
  border:1px solid var(--rule-2);border-radius:3px;color:var(--ink-3);
  background:var(--paper);
}

/* ── 参数栏 ───────────────────────────────────────────── */
.inspector{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:var(--surface);border-left:1px solid var(--rule);
}
.insp-head{
  flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--rule);
}
.insp-head b{font-size:10px;letter-spacing:.16em;color:var(--ink-3);font-weight:600}
.insp-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.insp-body::-webkit-scrollbar{width:10px}
.insp-body::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:5px;
  border:3px solid var(--surface)}

.sec{padding:11px 18px;border-bottom:1px solid var(--rule)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-h span{font-size:9.5px;letter-spacing:.15em;color:var(--ink-3);font-weight:600}
.sec-h em{font-style:normal;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 快门角 */
.angle{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:7px}
.angle b{font-size:24px;font-weight:500;letter-spacing:-.035em;line-height:.95;
  font-variant-numeric:tabular-nums}
.angle b small{font-size:13px;color:var(--ink-3);font-weight:400;margin-left:1px}
.angle em{font-style:normal;font-size:10.5px;color:var(--ink-3);padding-bottom:3px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.presets button{
  border:1px solid var(--rule);background:var(--paper);border-radius:5px;
  padding:3px 0;font-size:10.5px;color:var(--ink-2);
  transition:all .14s var(--ease);
}
.presets button:hover{border-color:var(--rule-2);color:var(--ink)}
.presets button.on{
  background:var(--accent-w);border-color:rgba(177,80,47,.4);color:var(--accent);
  font-weight:500;
}

/* 字段 */
.field{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.field label{font-size:11.5px;color:var(--ink-2)}
.field .v{font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:var(--mono);font-size:11px}
.field + input[type=range]{margin-bottom:8px}
.field + input[type=range]:last-child{margin-bottom:0}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:14px;
  background:transparent;cursor:pointer;display:block;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule-2);border-radius:1px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;
  background:var(--ink);border:0;transition:transform .12s var(--ease);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]:focus-visible{box-shadow:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:var(--focus)}

select.inline{
  -webkit-appearance:none;appearance:none;border:1px solid transparent;
  background:transparent;font-size:11.5px;color:var(--ink);text-align:right;
  cursor:pointer;padding:3px 16px 3px 6px;border-radius:5px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0l4 4 4-4' fill='none' stroke='%238c8677' stroke-width='1.1'/></svg>");
  background-repeat:no-repeat;background-position:right 4px center;
  transition:background-color .13s var(--ease),border-color .13s var(--ease);
}
select.inline:hover{background-color:var(--paper);border-color:var(--rule)}
select.inline option{background:var(--surface);color:var(--ink)}
select.inline.wide{width:100%;text-align:left;border-color:var(--rule);
  background-color:var(--paper);padding:4px 16px 4px 8px}

.switch{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:7px;cursor:pointer}
.switch>div{min-width:0}
.switch span{font-size:11.5px;color:var(--ink-2);display:block}
.switch small{display:block;font-size:10px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{
  position:relative;width:29px;height:16px;border-radius:9px;flex:none;
  background:var(--rule-2);transition:background .16s var(--ease);
}
.switch i::after{
  content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.22);
  transition:transform .16s var(--ease);
}
.switch input:checked + i{background:var(--ink)}
.switch input:checked + i::after{transform:translateX(13px)}
.switch input:focus-visible + i{box-shadow:var(--focus)}

/* 区间 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair label{display:block;font-size:10px;color:var(--ink-3);margin-bottom:3px}
.pair .tin{
  width:100%;border:0;border-bottom:1px solid var(--rule-2);background:transparent;
  padding:3px 0;font-size:11.5px;line-height:1.5;color:var(--ink);
  font-family:var(--mono);font-variant-numeric:tabular-nums;outline:none;
  transition:border-color .14s var(--ease);
}
.pair .tin:focus{border-bottom-color:var(--ink)}
.pair .tin::-webkit-outer-spin-button,
.pair .tin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.path{display:flex;gap:6px;align-items:center;margin-top:8px}
.path input{
  flex:1;min-width:0;border:0;border-bottom:1px solid var(--rule-2);background:transparent;
  padding:4px 0;font-size:11px;color:var(--ink-2);outline:none;
  transition:border-color .14s var(--ease);
}
.path input:focus{border-bottom-color:var(--ink)}

/* 底栏 */
.insp-foot{flex:none;padding:11px 18px 12px;border-top:1px solid var(--rule);background:var(--surface)}
.prog{height:2px;background:var(--rule);border-radius:1px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:2px;width:0;background:var(--accent);
  transition:width .3s var(--ease)}
.state{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-bottom:7px;font-size:11px;color:var(--ink-3);min-height:15px}
.state b{color:var(--ink-2);font-weight:500}
.state .right{font-variant-numeric:tabular-nums;white-space:nowrap}
.breakdown{
  font-size:10px;color:var(--ink-3);font-family:var(--mono);
  margin-bottom:8px;line-height:1.5;display:none;
}
.breakdown.on{display:block}

.logs{margin-top:8px;border-top:1px solid var(--rule);padding-top:7px}
.logs summary{
  list-style:none;font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  text-transform:uppercase;
}
.logs summary::-webkit-details-marker{display:none}
.logs summary::after{content:"+";font-size:12px;letter-spacing:0}
.logs[open] summary::after{content:"–"}
.logs pre{
  height:96px;overflow:auto;margin-top:6px;
  font:10px/1.7 var(--mono);color:var(--ink-3);white-space:pre-wrap;
}
.logs pre::-webkit-scrollbar{width:6px}
.logs pre::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:3px}

/* ── 文件选择 ─────────────────────────────────────────── */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:80;
  background:rgba(26,25,22,.26);backdrop-filter:blur(2px)}
.modal.on{display:grid}
.sheet{
  width:min(640px,92vw);max-height:min(560px,80vh);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:0 32px 80px -24px rgba(26,25,22,.45);overflow:hidden;
}
.sheet-hd{display:flex;align-items:baseline;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--rule);flex:none}
.sheet-hd b{font-size:12px;font-weight:600}
.sheet-hd span{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.sheet-ls{flex:1;min-height:0;overflow:auto;padding:6px}
.sheet-ls div{
  padding:6px 10px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--ink-2);
  display:flex;align-items:center;gap:7px;
  transition:background .12s var(--ease),color .12s var(--ease);
}
.sheet-ls div:hover{background:var(--paper);color:var(--ink)}
.sheet-ls div.f{color:var(--ink)}
.sheet-ls div i{font-style:normal;font-size:10px;color:var(--ink-3);width:11px;flex:none}
.sheet-ft{display:flex;justify-content:flex-end;gap:8px;padding:11px 18px;
  border-top:1px solid var(--rule);flex:none}

/* ── 提示 ─────────────────────────────────────────────── */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none}
.toast{
  background:var(--ink);color:#faf7f1;font-size:11.5px;padding:8px 14px;border-radius:100px;
  box-shadow:0 8px 24px -8px rgba(26,25,22,.6);
  animation:up .22s var(--ease);max-width:70vw;
}
.toast.bad{background:var(--err)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 响应式 ───────────────────────────────────────────── */
@media (max-width:1180px){
  :root{--rail:304px}
  .sec{padding:13px 16px}
  .angle b{font-size:26px}
}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr}
  .inspector{

/* ── 哑光深色主题覆盖 ───────────────────────────────── */
:root{
  --paper:#0f0f11;
  --surface:#151517;
  --sunken:#111113;
  --stage:#0f0f11;
  --ink:#e9e7e1;
  --ink-2:#b2afa7;
  --ink-3:#8f8c85;
  --rule:rgba(255,255,255,.07);
  --rule-2:rgba(255,255,255,.13);
  --accent:#a99578;
  --accent-w:rgba(169,149,120,.14);
  --ok:#7d9b84;
  --warn:#b89b67;
  --err:#b8756b;
  --focus:0 0 0 2px var(--accent);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:10px;
  --r-sm:8px;
  --r-lg:12px;
  --rail:360px;
  --h-top:64px;
  --h-bar:48px;
  --h-time:96px;
  --pad:24px;
  --mono:"Cascadia Mono","Consolas",ui-monospace,SFMono-Regular,monospace;
  --font-ui:"Microsoft YaHei UI","Microsoft YaHei","SimHei","Segoe UI",sans-serif;
}
html[lang="en"]{--font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif}
body{
  font-family:var(--font-ui);
  font-size:13px;
  line-height:1.5;
  color:var(--ink);
  background:var(--paper);
}
button,input,select,textarea{font:inherit}
button{min-height:36px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  box-shadow:none;
}
.icon{
  width:16px;height:16px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.app{grid-template-rows:var(--h-top) 1fr}
.topbar{padding:0 24px;gap:16px;background:var(--surface)}
.brand{gap:12px}
.mark{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:#242426;border:1px solid var(--rule);
}
.mark::before{left:7px;top:13px;width:12px;height:6px;border-radius:2px;background:#d9d5cd}
.mark::after{left:8px;top:15px;width:4px;height:2px;border-radius:1px;background:#d9d5cd}
.brand b{font-size:14px;letter-spacing:0}
.brand small{font-size:10px;letter-spacing:.08em;color:var(--ink-3)}
.chip{
  padding:8px 12px;border-radius:var(--r-sm);background:var(--sunken);
  border-color:var(--rule);
}
.chip b{font-size:12px}
.chip span{font-size:11px}
.tag-gpu i{width:8px;height:8px}
.tag-gpu.on i{box-shadow:none}
.lang-switch{
  display:inline-flex;align-items:center;gap:3px;padding:3px;
  border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--sunken);
}
.lang-switch button{
  min-height:28px;padding:3px 8px;border:0;border-radius:6px;background:transparent;
  color:var(--ink-3);font-size:10.5px;font-weight:500;
}
.lang-switch button:hover{color:var(--ink)}
.lang-switch button.on{background:#232326;color:var(--ink);font-weight:600}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:36px;padding:8px 16px;border-radius:var(--r-sm);
  transition:background .18s var(--ease),border-color .18s var(--ease),
             color .18s var(--ease),opacity .18s var(--ease);
}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink-2)}
.btn.ghost:hover{background:#1d1d20;border-color:var(--rule-2);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#f4f1ea}
.btn.solid:disabled,.btn.ghost:disabled{opacity:.38;cursor:not-allowed}
.btn.block{min-height:44px}
.btn.sm{min-height:32px;padding:6px 12px}
.icon-btn{
  width:36px;height:36px;min-height:36px;padding:0;border-radius:var(--r-sm);
  display:inline-grid;place-items:center;border:1px solid transparent;
  background:transparent;color:var(--ink-2);
}
.icon-btn:hover{background:#1d1d20;border-color:var(--rule);color:var(--ink)}
.workspace{grid-template-columns:minmax(0,1fr) var(--rail)}
.stage{background:var(--stage)}
.stage-bar{
  height:var(--h-bar);padding:0 20px;
  background:rgba(21,21,23,.9);border-bottom-color:var(--rule);
}
.seg{background:var(--sunken);border:1px solid var(--rule);border-radius:var(--r);padding:4px;gap:4px}
.seg button{
  min-height:32px;padding:4px 14px;border-radius:var(--r-sm);color:var(--ink-3);
  transition:background .18s var(--ease),color .18s var(--ease),font-weight .18s var(--ease);
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#232326;color:var(--ink);box-shadow:none;font-weight:600}
.stage-meta{font-size:11px}
.viewport{padding:24px}
.empty h2{font-size:16px;margin-bottom:8px;letter-spacing:0}
.empty p{font-size:13px;line-height:1.7}
.empty .btn{margin-top:20px}
.recent{margin-top:32px}
.recent h3{font-size:10px;letter-spacing:.08em;margin-bottom:8px}
.recent button{min-height:36px;padding:8px 12px;border-radius:var(--r-sm);font-size:12px}
.recent button:hover{background:#1d1d20}
.frame{
  border-radius:var(--r-lg);overflow:hidden;background:#08080a;
  border-color:var(--rule);
  box-shadow:0 4px 8px rgba(0,0,0,.08);
}
.frame img{
  max-height:calc(100dvh - var(--h-top) - var(--h-bar) - var(--h-time) - var(--pad) * 2);
}
.badge{
  top:12px;font-size:10px;letter-spacing:.06em;text-shadow:none;
  padding:4px 8px;border-radius:8px;background:rgba(15,15,17,.72);
  border:1px solid var(--rule);color:var(--ink);
}
.badge.l{left:12px}.badge.r{right:12px}
.wipe{width:2px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.wipe::after{
  width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
  background:#242426;border-color:rgba(255,255,255,.22);
  box-shadow:0 4px 8px rgba(0,0,0,.08);
}
.spin{
  top:16px;padding:6px 14px 6px 10px;border-radius:999px;
  background:rgba(21,21,23,.94);border-color:var(--rule);color:var(--ink-2);
  transition:opacity .18s var(--ease),transform .18s var(--ease);
}
.spin i{border-color:var(--rule-2);border-top-color:var(--accent)}
.timeline{background:var(--surface);border-top-color:var(--rule);padding:16px 20px 12px}
.track{height:32px;border-radius:var(--r);background:var(--sunken);border:1px solid var(--rule)}
.track .ticks{
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 100%);
  opacity:.6;
}
.track .band{
  background:rgba(169,149,120,.14);
  border-left-color:rgba(169,149,120,.5);border-right-color:rgba(169,149,120,.5);
}
.track .run{background:rgba(233,231,225,.08);border-right-color:rgba(233,231,225,.28)}
.track .head{width:2px;background:var(--ink);box-shadow:none}
.track .head::before{
  width:12px;height:12px;margin-left:-6px;border-radius:0 0 4px 4px;
  background:var(--ink);
}
.handle{
  width:16px;border:0;background:transparent;color:inherit;padding:0;
  min-height:0;display:grid;place-items:center;
}
.handle::after{
  width:8px;height:20px;border-radius:4px;background:rgba(169,149,120,.7);
  transition:background .18s var(--ease),height .18s var(--ease);
}
.handle:hover::after,.handle:focus-visible::after{background:var(--accent);height:24px}
.transport{gap:16px;margin-top:12px}
.tbtn{
  width:36px;height:36px;min-height:36px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:0;
}
.tbtn:hover{background:#1d1d20;color:var(--ink)}
.tc{font-size:12px}
.tips{font-size:10.5px}
.tips kbd{
  min-width:20px;min-height:20px;display:inline-grid;place-items:center;
  border-color:var(--rule-2);border-radius:6px;background:var(--sunken);color:var(--ink-2);
}
.inspector{background:var(--surface);border-left-color:var(--rule)}
.insp-head{height:48px;padding:0 24px}
.insp-head b{font-size:10px;letter-spacing:.08em}
.insp-body{scrollbar-color:var(--rule-2) transparent}
.insp-body::-webkit-scrollbar-thumb{background:var(--rule-2);border-color:var(--surface);border-radius:8px}
.sec{padding:16px 24px;border-bottom-color:var(--rule)}
.sec-h{margin-bottom:12px}
.sec-h span{font-size:10px;letter-spacing:.08em}
.sec-h em{font-size:11px}
.angle{margin-bottom:12px}
.angle b{font-size:28px;letter-spacing:0}
.angle b small{font-size:14px}
.angle em{font-size:11px}
.presets{gap:8px;margin-top:12px}
.presets button{
  min-height:36px;border-color:var(--rule);background:var(--sunken);
  border-radius:var(--r-sm);font-size:11px;
}
.presets button:hover{border-color:var(--rule-2);color:var(--ink)}
.presets button.on{
  background:var(--accent-w);border-color:rgba(169,149,120,.5);color:#d6c4a8;
}
.field{margin-bottom:8px}
.field label{font-size:12px;color:var(--ink-2)}
.field .v{font-size:12px}
.field + input[type=range]{margin-bottom:16px}
input[type=range]{height:24px}
input[type=range]::-webkit-slider-runnable-track{
  height:4px;background:var(--rule-2);border-radius:999px;
}
input[type=range]::-webkit-slider-thumb{
  width:16px;height:16px;margin-top:-6px;border-radius:50%;
  background:var(--ink);border:2px solid var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1)}
select.inline{
  min-height:36px;padding:6px 24px 6px 10px;border-radius:var(--r-sm);
  background-color:var(--sunken);border-color:var(--rule);
}
select.inline:hover{background-color:#1d1d20;border-color:var(--rule-2)}
select.inline.wide{min-height:40px;background-color:var(--sunken)}
.switch{min-height:40px;margin-top:12px;padding:4px 0}
.switch span{font-size:12px}
.switch small{font-size:10.5px;color:var(--ink-3)}
.switch i{width:40px;height:22px;border-radius:999px;background:var(--rule-2)}
.switch i::after{
  top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px);background:var(--paper)}
.pair{gap:16px}
.pair label{font-size:10.5px;color:var(--ink-3);margin-bottom:6px}
.pair .tin{
  min-height:40px;border:1px solid var(--rule);border-radius:var(--r-sm);
  background:var(--sunken);padding:8px 10px;color:var(--ink);
}
.pair .tin:focus{border-color:var(--accent)}
.path{gap:8px;margin-top:12px}
.path input{
  min-height:40px;border:1px solid var(--rule);border-radius:var(--r-sm);
  background:var(--sunken);padding:8px 10px;color:var(--ink-2);
}
.path input:focus{border-color:var(--accent)}
.insp-foot{padding:16px 24px;border-top-color:var(--rule);background:var(--surface)}
.prog{height:4px;border-radius:999px;background:var(--rule);margin-bottom:12px}
.prog i{height:4px;background:var(--accent)}
.state{margin-bottom:12px;font-size:12px}
.breakdown{font-size:10.5px;margin-bottom:12px}
.logs{margin-top:12px;padding-top:12px}
.logs summary{font-size:10px;letter-spacing:.08em}
.logs pre{height:112px;font-size:10.5px;color:var(--ink-3)}
.logs pre::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
.modal{background:rgba(0,0,0,.62);backdrop-filter:none}
.sheet{
  width:min(720px,92vw);max-height:min(640px,84vh);border-radius:var(--r-lg);
  background:#19191c;border-color:var(--rule);box-shadow:0 8px 8px rgba(0,0,0,.08);
}
.sheet-hd{padding:16px 24px;border-bottom-color:var(--rule)}
.sheet-hd b{font-size:13px}
.sheet-hd span{font-size:11px;flex:1;min-width:0}
.sheet-hd .icon-btn{margin-left:auto;flex:none}
.sheet-ls{padding:8px;scrollbar-color:var(--rule-2) transparent}
.sheet-ls button{
  width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:var(--r-sm);
  display:flex;align-items:center;gap:8px;background:transparent;
  color:var(--ink-2);text-align:left;font-size:12px;
}
.sheet-ls button:hover{background:#232326;color:var(--ink)}
.sheet-ls button.f{color:var(--ink)}
.sheet-ls button .icon{color:var(--ink-3)}
.sheet-ft{padding:12px 24px;border-top-color:var(--rule)}
.toasts{bottom:24px;gap:8px}
.toast{
  background:#242426;color:var(--ink);border:1px solid var(--rule-2);
  border-radius:var(--r);box-shadow:0 4px 8px rgba(0,0,0,.08);
}
.toast.bad{background:#2a1d1c;border-color:rgba(184,117,107,.45);color:#e1b8b2}
.scrim{background:rgba(0,0,0,.56)}
.rail-toggle{display:none}
::selection{background:rgba(169,149,120,.22);color:var(--ink)}

let LANG = "zh";
const TEXT_ORIGINALS = new WeakMap();
const ATTR_ORIGINALS = new WeakMap();
const STATIC_SKIP = "#fileChipName,#fileMeta,#gpuText,#angleV,#angleMs,#angleHint,#samplesV,#strengthV,#photoV,#costHint,#rangeMs,#latency,#status,#eta,#breakdown,#log,#mpath,#dst,#tcur,#tdur,#recentList,.sheet-ls";

function t(key, vars = {}){
  const template = (I18N[LANG] && I18N[LANG][key]) || (I18N.zh[key] || key);
  return template.replace(/\{(\w+)\}/g, (_, name) =>
    vars[name] === undefined ? "" : String(vars[name]));
}
function normalizedText(value){ return (value || "").replace(/\s+/g, " ").trim(); }
function applyStaticLanguage(lang){
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())){
    const parent = node.parentElement;
    if (!parent || parent.closest("script,style,svg") || parent.closest(STATIC_SKIP)) continue;
    if (!TEXT_ORIGINALS.has(node)) TEXT_ORIGINALS.set(node, node.nodeValue);
    const original = TEXT_ORIGINALS.get(node);
    const key = normalizedText(original);
    const translated = lang === "en" ? STATIC_EN[key] : null;
    if (translated){
      const lead = original.match(/^\s*/)[0];
      const tail = original.match(/\s*$/)[0];
      node.nodeValue = lead + translated + tail;
    }else{
      node.nodeValue = original;
    }
  }
  document.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el => {
    let saved = ATTR_ORIGINALS.get(el);
    if (!saved){
      saved = {};
      ATTR_ORIGINALS.set(el, saved);
    }
    for (const attr of ["placeholder", "title", "aria-label"]){
      if (!el.hasAttribute(attr)) continue;
      if (!(attr in saved)) saved[attr] = el.getAttribute(attr);
      const original = saved[attr];
      const translated = lang === "en" ? STATIC_EN[normalizedText(original)] : null;
      el.setAttribute(attr, translated || original);
    }
  });
}
function setStatus(key, vars = {}){
  S.statusKey = key;
  S.statusVars = vars;
  $("status").textContent = t(key, vars);
}
function setEta(key = "", vars = {}){
  S.etaKey = key;
  S.etaVars = vars;
  $("eta").textContent = key ? t(key, vars) : "";
}

  $("fileChipName").textContent = S.src ? displayName(S.src) : t("noVideo");
  $("gpuText").textContent = S.cuda ? S.gpuName.replace(/NVIDIA\s*/i, "") : t("cpuMode");
  $("btnRun").textContent = S.running ? t("cancelRender") : t("startRender");
  $("status").textContent = t(S.statusKey, S.statusVars);
  $("eta").textContent = S.etaKey ? t(S.etaKey, S.etaVars) : "";
  syncAngle();
  costHint();
  drawRange();
  if (S.lastLatency) $("latency").textContent = t("previewLatency", {ms: Math.round(S.lastLatency)});
  renderBreakdown();
}
function setLanguage(lang, persist = true){
  LANG = lang === "en" ? "en" : "zh";
  document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
  if (persist){
    try { localStorage.setItem("cineblur.lang", LANG); } catch(e){}

    const on = b.dataset.lang === LANG;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  applyStaticLanguage(LANG);
  refreshDynamicLanguage();
}

try { LANG = localStorage.getItem("cineblur.lang") || "zh"; } catch(e){}

/* ── 工具 ─────────────────────────────────────────────── */
function fmt(s){
  s = Math.max(0, s || 0);
  const m = Math.floor(s / 60);
  const r = s - m * 60;
  return String(m).padStart(2, "0") + ":" + r.toFixed(2).padStart(5, "0");
}
function fmtShort(s){
  s = Math.max(0, Math.round(s || 0));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function baseName(p){ return (p || "").split(/[\\/]/).pop(); }
function displayName(p){ return baseName(p).replace(/^[0-9a-f]{32}_/i, ""); }

function toast(msg, bad){
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity .25s";
    setTimeout(() => el.remove(), 260);
  }, bad ? 3600 : 2200);
}

/* ── 参数读取 ─────────────────────────────────────────── */
function params(){
  return {
    angle: +$("angle").value,
    samples: +$("samples").value,
    strength: +$("strength").value / 100,
    photometric: +$("photo").value / 100,
    quality: $("quality").value,
    robust: $("robust").checked,
    bicubic: $("bicubic").checked
  };
}

/* ── 时间轴 ───────────────────────────────────────────── */
function setTime(t, refresh){
  S.t = Math.min(Math.max(0, t), Math.max(0, S.dur - 0.001));
  $("tcur").textContent = fmt(S.t);
  const p = S.dur ? (100 * S.t / S.dur) : 0;
  $("head").style.left = p + "%";
  if (refresh) queuePreview();
}
function step(n){
  if (!S.src) return;
  setTime(S.t + n / (S.fps || 30), true);
}
function ratioAt(el, clientX){
  const r = el.getBoundingClientRect();
  return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
}

/* ── 对比线 ───────────────────────────────────────────── */
function setWipe(p){
  S.wipe = Math.min(100, Math.max(0, p));
  $("wipe").style.left = S.wipe + "%";
  $("imgB").style.clipPath = S.mode === "compare"
    ? "inset(0 0 0 " + S.wipe + "%)"
    : "none";
}
function setMode(m){
  S.mode = m;
  $("frame").dataset.mode = m;
  setWipe(S.wipe);
  document.querySelectorAll("#viewMode button").forEach(b =>
    {
      const on = b.dataset.mode === m;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
    });
}
document.querySelectorAll("#viewMode button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));

/* ── 预览 ─────────────────────────────────────────────── */
let timer = null;
function queuePreview(delay){
  clearTimeout(timer);
  timer = setTimeout(fetchPreview, delay === undefined ? 170 : delay);
}

async function fetchPreview(){
  if (!S.src) return;
  if (S.running || S.uploading){ return; }
  if (S.ctrl) S.ctrl.abort();
  S.ctrl = new AbortController();
  const signal = S.ctrl.signal;
  $("spin").classList.add("on");
  const p = params();
  const q = new URLSearchParams({
    src: S.src, t: S.t.toFixed(3), h: "540",
    angle: p.angle, samples: p.samples,
    strength: p.strength.toFixed(2),
    photometric: p.photometric.toFixed(2),
    quality: p.quality,
    robust: p.robust ? "1" : "0",
    bicubic: p.bicubic ? "1" : "0"
  });
  const t0 = performance.now();
  try{
    const rb = await fetch("/api/frame?" + q, {signal});
    if (!rb.ok) throw new Error(await rb.text() || t("previewFailed", {error: ""}));
    const bb = await rb.blob();

    const origKey = S.src + "|" + S.t.toFixed(3) + "|540";
    if (S.origKey !== origKey){
      const ra = await fetch("/api/frame?orig=1&" + q, {signal});
      if (!ra.ok) throw new Error(await ra.text() || t("originalPreviewFailed"));
      const ba = await ra.blob();
      if (S.origUrl) URL.revokeObjectURL(S.origUrl);
      S.origUrl = URL.createObjectURL(ba);
      S.origKey = origKey;
    }
    if (S.blurUrl) URL.revokeObjectURL(S.blurUrl);
    S.blurUrl = URL.createObjectURL(bb);
    $("imgA").src = S.origUrl;
    $("imgB").src = S.blurUrl;
    $("frame").hidden = false;
    $("empty").hidden = true;
    S.frameReady = true;
    setWipe(S.wipe);
    S.lastLatency = performance.now() - t0;
    $("latency").textContent = t("previewLatency", {ms: Math.round(S.lastLatency)});
  }catch(e){
    if (e.name !== "AbortError"){
      if (String(e.message).indexOf("busy") >= 0){
        toast(t("previewBusy"));
      }else{
        toast(t("previewFailed", {error: e.message}), true);
      }
    }
  }finally{
    $("spin").classList.remove("on");
  }
}

/* 拖动对比线 */
(function(){
  const vp = $("viewport");
  let dragging = false;
  vp.addEventListener("pointerdown", e => {
    if (!S.src || $("frame").hidden || S.mode !== "compare") return;
    const r = $("frame").getBoundingClientRect();
    if (e.clientX < r.left - 12 || e.clientX > r.right + 12) return;
    if (e.clientY < r.top - 12 || e.clientY > r.bottom + 12) return;
    dragging = true;
    vp.setPointerCapture(e.pointerId);
    setWipe(100 * (e.clientX - r.left) / r.width);
  });
  vp.addEventListener("pointermove", e => {
    if (!dragging) return;
    const r = $("frame").getBoundingClientRect();
    setWipe(100 * (e.clientX - r.left) / r.width);
  });
  const end = () => { dragging = false; };
  vp.addEventListener("pointerup", end);
  vp.addEventListener("pointercancel", end);
})();

/* 时间轴拖动 */
(function(){
  const track = $("track");
  let mode = null;
  let activePointer = null;
  const setFromX = x => {
    const r = track.getBoundingClientRect();
    const t = S.dur * Math.min(1, Math.max(0, (x - r.left) / r.width));
    if (mode === "in"){
      $("tin").value = Math.min(t, (+$("tout").value || S.dur)).toFixed(2);
      setTime(t, false);
      drawRange();
      queuePreview(180);
    }else if (mode === "out"){
      $("tout").value = Math.max(t, (+$("tin").value || 0)).toFixed(2);
      setTime(t, false);
      drawRange();
      queuePreview(180);
    }else{
      setTime(t, false);
      queuePreview(180);
    }
  };
  track.addEventListener("pointerdown", e => {
    if (!S.src) return;
    mode = e.target.id === "hIn" ? "in" : (e.target.id === "hOut" ? "out" : "play");
    activePointer = e.pointerId;
    track.setPointerCapture(e.pointerId);
    setFromX(e.clientX);
  });
  track.addEventListener("pointermove", e => { if (mode) setFromX(e.clientX); });
  const end = () => {
    if (!mode) return;
    mode = null;
    if (activePointer !== null && track.hasPointerCapture(activePointer)){
      track.releasePointerCapture(activePointer);
    }
    activePointer = null;
    queuePreview(0);
  };
  track.addEventListener("pointerup", end);
  track.addEventListener("pointercancel", end);
  track.addEventListener("lostpointercapture", end);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
})();

function drawRange(){
  if (!S.dur) return;
  const a = +$("tin").value || 0;
  let b = +$("tout").value || S.dur;
  b = Math.max(a, Math.min(b, S.dur));
  $("band").style.left = (100 * a / S.dur) + "%";
  $("band").style.width = (100 * Math.max(0, b - a) / S.dur) + "%";
  $("hIn").style.left = "calc(" + (100 * a / S.dur) + "% - 8px)";
  $("hOut").style.left = "calc(" + (100 * b / S.dur) + "% - 8px)";
  $("hIn").setAttribute("aria-valuenow", a.toFixed(2));
  $("hIn").setAttribute("aria-valuemax", S.dur.toFixed(2));
  $("hIn").setAttribute("aria-valuetext", fmtShort(a));
  $("hOut").setAttribute("aria-valuenow", b.toFixed(2));
  $("hOut").setAttribute("aria-valuemax", S.dur.toFixed(2));
  $("hOut").setAttribute("aria-valuetext", fmtShort(b));
  $("rangeMs").textContent = (b - a > 0)
    ? t("rangeValue", {
        sec: (b - a).toFixed(1),
        frames: Math.max(1, Math.round((b - a) * (S.fps || 30)))
      })
    : t("rangeFull");
}

/* ── 参数联动 ─────────────────────────────────────────── */
function syncAngle(){
  const v = +$("angle").value;
  $("angleV").innerHTML = v + "<small>°</small>";
  const fps = S.fps || 30;
  $("angleMs").textContent = t("exposure", {ms: (v / 360 / fps * 1000).toFixed(1)});
  const hint = v < 60 ? "angleHard" : v < 150 ? "angleAction" : v <= 210 ? "angleStandard"
             : v < 300 ? "angleVisible" : "angleLong";
  $("angleHint").textContent = t(hint);
  document.querySelectorAll(".presets button").forEach(b =>
    b.classList.toggle("on", +b.dataset.angle === v));
}
function costHint(){
  const n = +$("samples").value;
  const q = $("quality").value;
  const w = { turbo: 0.45, fast: 0.62, std: 1, fine: 1.7 }[q] || 1;
  $("costHint").textContent = t("relativeCost", {x: (n * w / 16).toFixed(1)});
}
function preset(v){ $("angle").value = v; syncAngle(); queuePreview(); }

$("angle").addEventListener("input", syncAngle);
$("angle").addEventListener("change", () => queuePreview());
$("samples").addEventListener("input", e => { $("samplesV").textContent = e.target.value; costHint(); });
$("samples").addEventListener("change", () => queuePreview());
$("strength").addEventListener("input", e => {
  $("strengthV").textContent = e.target.value + "%";
});
$("strength").addEventListener("change", () => queuePreview());
$("photo").addEventListener("input", e => { $("photoV").textContent = e.target.value + "%"; });
$("photo").addEventListener("change", () => queuePreview());
$("quality").addEventListener("change", () => { costHint(); queuePreview(); });
$("robust").addEventListener("change", () => queuePreview());
$("bicubic").addEventListener("change", () => queuePreview());
$("tin").addEventListener("change", () => { drawRange(); queuePreview(); });
$("tout").addEventListener("change", () => { drawRange(); queuePreview(); });
$("tin").addEventListener("input", drawRange);
$("tout").addEventListener("input", drawRange);
setLanguage(LANG, false);
$("btnRun").disabled = true;      // 未打开素材前不提供主操作

/* ── 文件选择 ─────────────────────────────────────────── */
let pickTarget = "src", curPath = "";
let pickerReturnFocus = null;
function chooseVideo(){
  if (S.running){ toast(t("waitRender")); return; }
  if (S.uploading){ toast(t("waitUpload")); return; }
  const api = window.pywebview && window.pywebview.api;
  if (api && api.select_video){
    api.select_video().then(path => {
      if (path) loadVideo(path);
    }).catch(() => $("fileInput").click());
  }else{
    $("fileInput").click();
  }
}
function uploadVideo(file){
  if (!file) return;
  S.uploading = true;
  setStatus("uploading", {name: file.name});
  setEta();
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  xhr.setRequestHeader("Content-Type", "application/octet-stream");
  xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
  xhr.upload.onprogress = e => {
    if (e.lengthComputable){
      setStatus("uploadingProgress", {pct: Math.round(100 * e.loaded / e.total)});
    }
  };
  xhr.onload = () => {
    let d = {};
    try { d = JSON.parse(xhr.responseText || "{}"); } catch(e){}
    if (xhr.status >= 200 && xhr.status < 300 && d.ok){
      S.uploading = false;
      loadVideo(d.path);
    }else{
      S.uploading = false;
      setStatus("ready");
      toast(t("uploadFailed", {error: d.error || xhr.statusText || t("unknownError")}), true);
    }
  };
  xhr.onerror = () => {
    S.uploading = false;
    setStatus("ready");
    toast(t("uploadFailed", {error: xhr.statusText || t("unknownError")}), true);
  };
  xhr.send(file);
}
$("fileInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (file) uploadVideo(file);
});

function openPicker(target){
  pickTarget = target === "dst" ? "dst" : "src";
  pickerReturnFocus = document.activeElement;
  const cur = pickTarget === "src" ? S.src : $("dst").value;
  const start = cur && cur.indexOf(".") > 0 ? cur.replace(/[\\/][^\\/]*$/, "") : "";
  loadList(start);
}
function loadList(path){
  fetch("/api/list?path=" + encodeURIComponent(path)).then(r => r.json()).then(d => {
    curPath = d.path;
    $("mpath").textContent = d.path || t("selectDisk");
    const el = $("mlist");
    el.innerHTML = "";
    if (d.parent !== null && d.path){
      el.appendChild(row("i-arrow-up", t("parentDir"), () => loadList(d.parent)));
    }
    d.dirs.forEach(n => {
      el.appendChild(row("i-folder", n, () =>
        loadList((d.path || "").replace(/[\\/]$/, "") + (d.path ? "\\" : "") + n)));
    });
    d.files.forEach(n => {
      el.appendChild(row("i-file-video", n, () => {
        const full = d.path.replace(/[\\/]$/, "") + "\\" + n;
        if (pickTarget === "src") loadVideo(full);
        else { $("dst").value = full; closeModal(); }
      }, true));
    });
    $("modal").classList.add("on");
    setTimeout(() => el.querySelector("button")?.focus(), 0);
  }).catch(() => toast(t("listFailed"), true));
}
function row(iconId, label, onclick, isFile){
  const x = document.createElement("button");
  x.type = "button";
  if (isFile) x.className = "f";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "icon");
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#" + iconId);
  svg.appendChild(use);
  const s = document.createElement("span"); s.textContent = label;
  x.appendChild(svg); x.appendChild(s);
  x.onclick = onclick;
  return x;
}
function closeModal(){
  if (!$("modal").classList.contains("on")) return;
  $("modal").classList.remove("on");
  if (pickerReturnFocus && pickerReturnFocus.focus) pickerReturnFocus.focus();
  pickerReturnFocus = null;
}
function useDir(){
  if (!curPath) return;
  if (pickTarget === "src") loadVideo(curPath);
  else { $("dst").value = curPath.replace(/[\\/]$/, "") + "\\output.mp4"; closeModal(); }
}
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("modal").addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const items = [...$("modal").querySelectorAll("button:not(:disabled), input:not(:disabled)")];
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first){
    e.preventDefault(); last.focus();
  }else if (!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
});

["hIn", "hOut"].forEach((id, index) => {
  $(id).addEventListener("keydown", e => {
    if (!S.src) return;
    const direction = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
    if (!direction) return;
    e.preventDefault();
    const input = index === 0 ? $("tin") : $("tout");
    const delta = direction * (e.shiftKey ? 5 : 1) / (S.fps || 30);
    let value = (+input.value || 0) + delta;
    if (index === 0){
      value = Math.min(Math.max(0, value), +$("tout").value || S.dur);
    }else{
      value = Math.max(Math.min(S.dur, value), +$("tin").value || 0);
    }
    input.value = value.toFixed(2);
    drawRange();
    queuePreview();
  });
});

/* ── 最近打开 ─────────────────────────────────────────── */
const RECENT_KEY = "cineblur.recent";
function readRecent(){
  try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }catch(e){ return []; }
}
function pushRecent(p){
  let list = readRecent().filter(x => x !== p);
  list.unshift(p);
  list = list.slice(0, 5);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const list = readRecent();
  const box = $("recent"), wrap = $("recentList");
  if (!list.length){ box.hidden = true; return; }
  box.hidden = false;
  wrap.innerHTML = "";
  list.forEach(p => {
    const b = document.createElement("button");
    b.textContent = displayName(p);
    b.title = p;
    b.onclick = () => loadVideo(p);
    wrap.appendChild(b);
  });
}
renderRecent();

/* ── 载入素材 ─────────────────────────────────────────── */
function loadVideo(path){
  closeModal();
  if (S.running){ toast(t("waitRender")); return; }
  if (S.uploading){ toast(t("waitUpload")); return; }
  fetch("/api/info?path=" + encodeURIComponent(path)).then(r => r.json()).then(d => {
    if (!d.ok){
      toast(t("cannotRead", {error: d.error || t("unknownError")}), true);
      return;
    }
    S.src = path; S.dur = d.duration; S.fps = d.fps || 30;
    S.uploading = false;
    S.origKey = "";
    if (S.origUrl){ URL.revokeObjectURL(S.origUrl); S.origUrl = ""; }
    if (S.blurUrl){ URL.revokeObjectURL(S.blurUrl); S.blurUrl = ""; }
    const chip = $("fileChip");
    chip.classList.remove("empty");
    $("fileChipName").textContent = displayName(path);
    $("fileMeta").textContent = d.width + "×" + d.height + " · " +
      (d.fps || 0).toFixed(2) + "fps";
    $("tdur").textContent = fmt(d.duration);
    $("dst").value = path.replace(/\.[^.]+$/, "") + "_blur.mp4";
    $("tout").value = d.duration.toFixed(2);
    $("tin").value = "0";
    drawRange();
    setTime(d.duration * 0.45, false);
    pushRecent(path);
    syncAngle();
    $("btnRun").disabled = false;
    setStatus("ready");
    setEta();
    fetchPreview();
  }).catch(e => {
    S.uploading = false;
    toast(t("readFailed", {error: e.message}), true);
  });
}

/* ── 渲染 ─────────────────────────────────────────────── */
function runPrimary(){
  if (S.running){ cancelRender(); return; }
  if (S.uploading){ toast(t("waitUpload")); return; }
  startRender();
}
function startRender(){
  if (!S.src){ toast(t("openFirst")); return; }
  const p = params();
  const body = {
    src: S.src, dst: $("dst").value.trim(),
    angle: p.angle, samples: p.samples, strength: p.strength,
    photometric: p.photometric, quality: p.quality, robust: p.robust,
    bicubic: p.bicubic,
    preview: +$("res").value, codec: $("codec").value,
    trim_start: +$("tin").value || 0, trim_end: +$("tout").value || 0
  };
  S.breakdownParts = null;
  renderBreakdown();
  $("log").textContent = "";
  $("logs").hidden = true;
  $("logs").open = false;
  $("bar").style.width = "0%";
  $("tprog").style.width = "0%";
  S.running = true;
  $("btnRun").textContent = t("cancelRender");
  $("btnRun").classList.remove("solid");
  $("btnRun").classList.add("ghost");
  setStatus("starting");
  fetch("/api/start", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    if (!d.ok){
      toast(t("startFailed") + (d.error ? ": " + d.error : ""), true);
      resetRunUI();
    }else{
      $("dst").value = d.output;
    }
  }).catch(e => { toast(t("startFailed") + ": " + e.message, true); resetRunUI(); });
}
function cancelRender(){
  fetch("/api/cancel", {method: "POST"});
  setStatus("cancelling");
}
function resetRunUI(){
  S.running = false;
  $("btnRun").textContent = t("startRender");
  $("btnRun").classList.add("solid");
  $("btnRun").classList.remove("ghost");
}
function reveal(){
  fetch("/api/open", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path: $("dst").value.trim()})
  });
}

/* ── 进度流 ───────────────────────────────────────────── */
let since = 0;
function showBreakdown(prof){
  if (!prof) return;
  const parts = {
    flow: prof.flow_ms ? Math.round(prof.flow_ms) : "—",
    render: prof.render_ms ? Math.round(prof.render_ms) : "—",
    dec: prof.dec_ms ? Math.round(prof.dec_ms) : "—",
    enc: prof.enc_ms ? Math.round(prof.enc_ms) : "—"
  };
  if (Object.values(parts).every(v => v === "—")) return;
  S.breakdownParts = parts;
  renderBreakdown();
}
function renderBreakdown(){
  const el = $("breakdown");
  if (!S.breakdownParts){
    el.classList.remove("on");
    el.textContent = "";
    return;
  }
  el.textContent = t("breakdown", S.breakdownParts);
  el.classList.add("on");
}
function connect(){
  const es = new EventSource("/api/events?since=" + since);
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    since = d.since;
    const p = d.progress || {};
    if (d.running && p.total){
      const pct = 100 * p.done / p.total;
      $("bar").style.width = pct.toFixed(1) + "%";
      $("tprog").style.width = pct.toFixed(1) + "%";
      setStatus("rendering", {done: p.done, total: p.total});
      setEta("fpsEta", {fps: p.fps.toFixed(2), time: fmtShort(p.eta)});
      if (!S.running){
        S.running = true;
        $("btnRun").textContent = t("cancelRender");
        $("btnRun").classList.remove("solid");
        $("btnRun").classList.add("ghost");
      }
    }
    if (d.log && d.log.length){
      const el = $("log");
      el.textContent += d.log.join("\n") + "\n";
      el.scrollTop = el.scrollHeight;
      $("logs").hidden = false;
    }
    if (!d.running && S.running){
      resetRunUI();
      if (d.error){
        setStatus("failed");
        setEta();
        toast(t("renderFailed", {error: d.error}), true);
      }else if (d.result && d.result.cancelled){
        setStatus("cancelled");
        setEta();
      }else if (d.result){
        $("bar").style.width = "100%";
        $("tprog").style.width = "100%";
        setStatus("complete", {frames: d.result.frames});
        setEta("fpsSize", {fps: d.result.fps.toFixed(2), size: d.result.size});
        showBreakdown(d.result.profile);
        toast(t("renderComplete"));
        $("reveal").hidden = false;
      }
    }
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
connect();

/* ── 键盘 ─────────────────────────────────────────────── */
document.addEventListener("keydown", e => {
  const tag = e.target.tagName;
  const typing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || tag === "BUTTON";
  if (e.key === "Escape"){ closeModal(); toggleRail(false); return; }
  if (typing) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(e.shiftKey ? -5 : -1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); step(e.shiftKey ? 5 : 1); }
  else if (e.key === "["){ preset(Math.max(0, +$("angle").value - 30)); }
  else if (e.key === "]"){ preset(Math.min(360, +$("angle").value + 30)); }
  else if (e.key === "c"){ cycleMode(); }
  else if (e.key === " "){ e.preventDefault(); runPrimary(); }
});
function cycleMode(){
  const order = ["compare", "orig", "blur"];
  setMode(order[(order.indexOf(S.mode) + 1) % 3]);
}

/* ── 侧栏（窄屏抽屉） ─────────────────────────────────── */
function toggleRail(force){
  const on = force === undefined ? !$("inspector").classList.contains("open") : force;
  $("inspector").classList.toggle("open", on);
  $("scrim").classList.toggle("on", on);
  $("railToggle").setAttribute("aria-expanded", String(on));
}

/* ── 环境 ─────────────────────────────────────────────── */
fetch("/api/env").then(r => r.json()).then(d => {
  const chip = $("gpuChip");
  S.cuda = !!d.cuda;
  S.gpuName = d.gpu || "";
  if (d.cuda && d.gpu){
    chip.classList.add("on");
    $("gpuText").textContent = S.gpuName.replace(/NVIDIA\s*/i, "");
  }else{
    $("gpuText").textContent = t("cpuMode");
  }
  if (!d.ffmpeg) toast(t("ffmpegMissing"), true);
}).catch(() => {});

/* 支持 ?open=<路径>（命令行传参 / 拖到程序图标） */
(function(){
  const p = new URLSearchParams(location.search).get("open");
  if (p) loadVideo(p);
})();
